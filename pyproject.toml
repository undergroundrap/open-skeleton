[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-skeleton"
version = "0.1.0"
description = "Local-first, evidence-first codebase intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [
  { name = "Ocean Bennett" },
]
keywords = ["code-intelligence", "static-analysis", "local-first", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
  "build>=1.2,<2",
  # Upper bounds are deliberate: ruff and mypy gate CI, and an unpinned major or
  # minor bump silently reclassifies existing code as failing.
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "ruff>=0.16,<0.17",
]

[project.scripts]
open-skeleton = "open_skeleton.cli:main"
open-skeleton-mcp = "open_skeleton.mcp_server:main"

[project.urls]
Repository = "https://github.com/undergroundrap/open-skeleton"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"open_skeleton.spec" = ["profiles/*.json"]

[tool.setuptools.data-files]
"share/open-skeleton/schemas" = ["schemas/*.json"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Broad by default. This project makes correctness claims about other people's
# code, so its own defect classes should be caught mechanically rather than in
# review.
select = [
  "A",    # shadowed builtins
  "ARG",  # unused arguments
  "B",    # bugbear: likely bugs
  "BLE",  # blind except
  "C4",   # comprehension clarity
  "DTZ",  # naive datetimes
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "G",    # logging format
  "I",    # import order
  "INP",  # implicit namespace packages
  "ISC",  # implicit string concatenation
  "N",    # naming
  "PERF", # obvious performance traps
  "PIE",  # misc lints
  "PLC", "PLE", "PLW",  # pylint conventions, errors, warnings
  "PTH",  # pathlib over os.path
  "RET",  # return consistency
  "RUF",  # ruff-specific
  "S",    # bandit security rules
  "SIM",  # simplification
  "SLF",  # private member access
  "T20",  # stray print/pprint
  "TID",  # tidy imports
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  # The CLI's job is to write to stdout.
  "T201",
  # `ruff format` owns line length. What it leaves long is a single
  # unsplittable token — a URL, a message, or a regex — and breaking those by
  # hand costs more readability than it buys.
  "E501",
  # Report builders append to a `lines` list inside branching loops. Rewriting
  # those as comprehensions obscures the order the document is assembled in.
  "PERF401",
]

[tool.ruff.lint.per-file-ignores]
"src/open_skeleton/cli.py" = ["T201"]
# Query builders interpolate clause fragments drawn from a closed set of column
# names defined in this module. Every caller-supplied value is bound with a `?`
# placeholder. The diagnostic cannot be suppressed inline because it anchors to
# the opening line of a triple-quoted string.
"src/open_skeleton/ledger.py" = ["S608"]
# Standalone measurement scripts, deliberately not an importable package.
"benchmarks/**" = ["T201", "S101", "INP001"]
# The local gate runner is invoked by path, not imported, and reports to
# a terminal, so printing and a non-package layout are the point.
"scripts/**" = ["T201", "INP001"]
# The suite is unittest by choice: it ships with the standard library, which
# keeps the deterministic path dependency-free.
"tests/**" = [
  "S101",    # assert is the point of a test
  "SLF001",  # tests reach into internals deliberately
  "ARG",     # fake callbacks take arguments they ignore
  "PLR2004", # fixture literals are clearer inline
  "RUF012",  # fixture tables are class-level constants by design
  "S310",    # dashboard tests open a loopback URL they just started
  "S104",    # a test asserts that binding to all interfaces is rejected
  "PLC0415", # optional extras are imported inside the test that needs them
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
ignore_missing_imports = true
