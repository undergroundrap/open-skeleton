[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-skeleton"
version = "0.1.0"
description = "Local-first, evidence-first codebase intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [
  { name = "Ocean Bennett" },
]
keywords = ["code-intelligence", "static-analysis", "local-first", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
  "build>=1.2,<2",
  # Upper bounds are deliberate: ruff and mypy gate CI, and an unpinned major or
  # minor bump silently reclassifies existing code as failing.
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "ruff>=0.16,<0.17",
]

[project.scripts]
open-skeleton = "open_skeleton.cli:main"
open-skeleton-mcp = "open_skeleton.mcp_server:main"

[project.urls]
Repository = "https://github.com/undergroundrap/open-skeleton"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"open_skeleton.spec" = ["profiles/*.json"]

[tool.setuptools.data-files]
"share/open-skeleton/schemas" = ["schemas/*.json"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
