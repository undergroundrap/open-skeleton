name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[mcp]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -e ".[dev,mcp]"
      - name: Format check
        run: ruff format --check src tests benchmarks
      - name: Ruff
        run: ruff check src tests benchmarks
      - name: Mypy (strict)
        run: mypy
      - name: Dependency audit
        run: pip-audit --local
      - name: Build distributions
        run: python -m build

  pinned-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Open Skeleton
        run: python -m pip install -e .
      - name: Checkout pinned public fixture
        run: |
          git clone https://github.com/undergroundrap/SINGLE-PLAYER-AI-MUD.git fixture
          git -C fixture checkout 93ebd51cb4083d2307564c265394358e53c4f5ca
      - name: Run comparative benchmark
        run: >-
          open-skeleton benchmark fixture
          --gold benchmarks/single-player-ai-mud/gold.json
          --output-dir benchmark-output
      - uses: actions/upload-artifact@v4
        with:
          name: single-player-ai-mud-benchmark
          path: benchmark-output/
